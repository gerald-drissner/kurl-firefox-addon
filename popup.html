<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kURL</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup-body"><div id="popup-shell" class="card">
<header class="popup-browser-header"><h1>kURL · YOURLS</h1><button id="open-dashboard" class="secondary" type="button" data-i18n-key="dashboardTitle">Dashboard</button></header>
<section id="setup-message" hidden><p data-i18n-key="errorNoSettings">Configure your YOURLS server in Settings first.</p><button id="open-settings" data-i18n-key="popupBtnGoToSettings">Open Settings</button></section>
<section id="main-content" hidden>
<label for="longUrl" data-i18n-key="popupLongUrlLabel">Destination URL</label><input id="longUrl" type="url" placeholder="https://example.com/article">
<details><summary data-i18n-key="popupAdvancedOptions">Advanced options</summary><label for="keyword" data-i18n-key="popupKeywordLabel">Custom keyword (optional)</label><input id="keyword"><label for="title" data-i18n-key="popupTitleLabel">Title (optional)</label><input id="title"></details>
<div class="row"><button id="btnShorten" type="button" data-i18n-key="popupBtnShorten">Shorten</button><button id="btnCurrentPage" class="secondary" type="button" data-i18n-key="popupCurrentPage">Use current page</button></div>
<label for="shortUrl" data-i18n-key="popupShortUrlLabel">Short URL</label><input id="shortUrl" type="text" readonly>
<div class="row"><button id="btnCopy" class="secondary" type="button" data-i18n-key="popupBtnCopy">Copy</button><button id="btnQrCode" class="secondary" type="button" data-i18n-key="popupBtnShowQr">Show QR</button><button id="btnDownloadQr" class="secondary" type="button" data-i18n-key="popupBtnDownloadQr" hidden>Download QR</button></div>
<div id="qrcode-display" class="qr-container" hidden></div>
<label for="statsInput" data-i18n-key="popupStatsLabel">Statistics: short URL or keyword</label><input id="statsInput" type="text" placeholder="abc123"><button id="btnStats" class="secondary" type="button" data-i18n-key="popupBtnStats">Statistics</button>
<p id="msg" class="info" role="status" aria-live="polite"></p><details><summary data-i18n-key="popupBtnToggleJson">Detailed JSON</summary><pre id="json"></pre></details>
</section></div><script src="JS/polyfill.js"></script><script src="JS/helpers.js"></script><script src="JS/qrcode.js"></script><script src="JS/popup.js"></script></body></html>
